version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: concast_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-concast_db}
      MYSQL_USER: ${DB_USER:-concast_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - concast_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: concast_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn simulator_project.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - IS_DOCKER=1
      - DB_NAME=${DB_NAME:-concast_db}
      - DB_USER=${DB_USER:-concast_user}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
      - MEDIA_ROOT=/app/media
      - SESSION_EXPIRE_AT_BROWSER_CLOSE=False
      - ALLOWED_HOSTS=backend localhost 127.0.0.1
      - USE_HTTPS=${USE_HTTPS:-False}
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - concast_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: concast_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - concast_network

volumes:
  mariadb_data:
    name: concast_mariadb_data
  media_files:
    name: concast_media_files
  static_files:
    name: concast_static_files

networks:
  concast_network:
    name: concast_network
    driver: bridge
