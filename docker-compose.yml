# SPARC: start with `docker compose up -d` (or double-click start.command / start.bat)
# and open http://localhost:3000. Optional settings are in .env (see .env.example).
name: sparc

services:
  backend:
    build: ./backend
    image: sparc-backend
    restart: unless-stopped
    environment:
      # Only reachable through the website container, which checks the address
      ALLOWED_HOSTS: "*"
      SPARC_ADMIN_USER: ${SPARC_ADMIN_USER:-admin}
      SPARC_ADMIN_PASSWORD: ${SPARC_ADMIN_PASSWORD:-sparc}
      USE_HTTPS: ${USE_HTTPS:-False}
    volumes:
      - sparc_data:/data                  # Database and secret key
      - ./data:/app/demo_data:ro          # CONCAST data, loaded on the first start
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
      start_interval: 1s

  frontend:
    build: ./frontend
    image: sparc-frontend
    restart: unless-stopped
    ports:
      # 127.0.0.1 = this computer only. Set SPARC_HOST=0.0.0.0 in .env to open it to the network
      # (and change the admin password first).
      - "${SPARC_HOST:-127.0.0.1}:${SPARC_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sparc_data:
