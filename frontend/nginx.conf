server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSV and YAML uploads in the admin
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv text/javascript application/javascript application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Everything Django serves: API, admin pages and the admin styles.
    # $http_host keeps the port, so Django's CSRF check accepts the page's own address.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Optimisations and long simulations can take a while
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Built files have a content hash in their name: cache them for long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Website pages (React router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
